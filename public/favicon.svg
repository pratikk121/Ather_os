<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Dark Obsidian Glass Squircle -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Liquid Refraction Gradient -->
    <linearGradient id="liquidGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Outer Specular Ring Gradient -->
    <linearGradient id="specularRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Prismatic Glass Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#specularRing)" stroke-width="8" fill="none" opacity="0.6"/>

  <!-- Ambient Internal Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#liquidGrad)" opacity="0.35" filter="url(#glow)"/>

  <!-- Aether Liquid Droplet Core -->
  <path d="M256 100 C256 100 370 230 370 310 C370 373 319 424 256 424 C193 424 142 373 142 310 C142 230 256 100 256 100 Z" 
        fill="url(#liquidGrad)" 
        opacity="0.95"/>

  <!-- Inner Specular Highlight Reflection (Glass convex sheen) -->
  <path d="M256 130 C256 130 330 235 330 295 C330 325 310 350 280 360 C260 335 240 280 240 240 C240 195 256 130 256 130 Z" 
        fill="#ffffff" 
        opacity="0.45"/>

  <!-- Center Aether Core -->
  <circle cx="256" cy="300" r="18" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="300" r="8" fill="#09090b"/>
</svg>
